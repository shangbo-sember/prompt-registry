prompt_id: PRM-IMG-003
slug: water-cup-cover
title: 玻璃水杯封面图回归用例
cases:
  - case_id: C1
    intent: 必现元素是否齐全
    checks:
      - 杯子为直筒玻璃材质，通透，杯身无花纹
      - 杯身正面有品牌标识，单色、尺寸克制，不喧宾夺主
      - 杯内装水约七分满，水面有高光
      - 背景为浅灰白色，画面无其他道具
      - 杯子居中，左侧上方留白可放标题
    auto_checkable: false

  - case_id: C2
    intent: 禁忌是否被违反
    checks:
      - 除杯身自有标识外，画面无其他文字、无水印、无二维码
      - 无第三方品牌标识、无竞品包装
      - 无人物、无手部
    auto_checkable: false

  - case_id: C3
    intent: 品牌标识准确性（v2 起新增，对外发布前必查）
    checks:
      - 「影刀」二字字形正确、无错字、无变形
      - 图形标与官方标识一致，不是模型自行发挥的近似图形
      - 标识未被杯身曲面拉扯变形到失真
      - 若图形标不准确，结论写「需后期贴官方素材」，不得直接判定通过
    auto_checkable: false

  - case_id: C4
    intent: 材质与光影真实度
    checks:
      - 玻璃厚度与折射真实，不像塑料
      - 有柔和投影，不出现硬阴影或刺眼高光
    auto_checkable: false

  - case_id: C5
    intent: 版式适配
    checks:
      - 16:9 下主体占比合理，不过大过小
      - 缩略图尺寸下仍能一眼看清主体轮廓
    auto_checkable: false
