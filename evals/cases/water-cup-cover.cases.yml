prompt_id: PRM-IMG-003
slug: water-cup-cover
title: 玻璃水杯封面图回归用例
cases:
  - case_id: C1
    intent: 必现元素是否齐全
    checks:
      - 杯子为直筒玻璃材质，通透，杯身无花纹
      - 杯身正面有品牌 logo，位于杯身下部、水面线以下
      - 杯内装水约七分满，水面有高光
      - 背景为浅灰白色，画面无其他道具
      - 杯子居中，左侧上方留白可放标题
    auto_checkable: false

  - case_id: C2
    intent: 禁忌是否被违反
    checks:
      - 除 logo 外，画面无其他文字、无水印、无二维码
      - 无第三方品牌标识、无竞品包装
      - 无人物、无手部
    auto_checkable: false

  - case_id: C3
    intent: 品牌 logo 合规性（对外发布前必查）
    checks:
      - logo 取自官方素材 yingdao-logo.png，不是模型绘制或改色的近似图形
      - 原比例 2.71 未变，无拉伸、压扁、旋转、加描边或投影
      - 宽度不小于 480px，字标清晰可读
      - 未压在水面线、杯口边缘或杯底厚边上
      - 深灰字标在浅灰白背景上对比度足够
      - 四周留白不小于红圆直径的 1/2
    auto_checkable: false

  - case_id: C4
    intent: 材质与光影真实度
    checks:
      - 玻璃厚度与折射真实，不像塑料
      - 有柔和投影，不出现硬阴影或刺眼高光
      - logo 贴合玻璃表面，无「贴纸浮在杯前」的观感
    auto_checkable: false

  - case_id: C5
    intent: 版式适配
    checks:
      - 16:9 下主体占比合理，不过大过小
      - 缩略图尺寸下仍能一眼看清主体轮廓与 logo 位置
    auto_checkable: false
